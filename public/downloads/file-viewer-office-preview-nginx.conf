server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /office-preview {
    return 301 /office-preview/;
  }

  # Mount dist at /usr/share/nginx/html/office-preview in Docker Compose.
  location /office-preview/ {
    try_files $uri $uri/ /office-preview/index.html;
  }

  # Replace this upstream with the authenticated file-preview endpoint.
  location /office-files/ {
    proxy_pass http://file-service/internal/preview/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  location ~* ^/office-preview/.*\.wasm$ {
    types {
      application/wasm wasm;
    }
    default_type application/wasm;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /office-preview/office-preview-license.json {
    expires -1;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~* ^/office-preview/.*\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data: https://font.flyfish.group https://font-gateway.wybaby168.workers.dev; worker-src 'self' blob:; connect-src 'self' https://font.flyfish.group https://font-gateway.wybaby168.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
}
